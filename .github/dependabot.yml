# Group routine updates so this lab receives one reviewable pull request per
# ecosystem instead of one pull request per dependency. Breaking majors remain
# separately reviewable and are not auto-merged; every other update still has
# to pass the complete application, browser, accessibility, and mutation gate.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
